[project]
name = "triage-sql"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pandas>=3.1.1",
    "polars>=2.2.0",
    "pyyaml>=6.0.4",
]

[project.scripts]
triage-sql = "triage_sql:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
