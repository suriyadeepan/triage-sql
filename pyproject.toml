[project]
name = "triage-sql"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "pandas>=3.1.1",
    "polars>=2.2.0",
    "psycopg[binary]>=3.3.9,<3.4",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.4",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.3.0",
    "sqlglot>=30.35.0",
]

[project.scripts]
triage-sql = "triage_sql:main"

[project.optional-dependencies]
rerank = [
    "cohere>=6.1,<7",
]
openai-benchmark = [
    "openai>=2.12,<3",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
