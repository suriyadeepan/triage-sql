profiling_evidence:
  provenance: Manual full-file subtype counts supplied by the user; randomized referential samples are recorded separately.
  client_type_counts_and_id_ranges:
    Individual: {id_min: 1, id_max: 2800000, rows: 2800000}
    Group: {id_min: 2800001, id_max: 3200000, rows: 400000}
    NSG: {id_min: 3200001, id_max: 3400000, rows: 200000}
    Corporate: {id_min: 3400001, id_max: 4000000, rows: 600000}
  source_profile_counts:
    collaterals.owner_id:
      Individual: 11159
      Corporate: 2414
      Group: 1579
      NSG: 848
    groups_members.group_id: {Group: 399867}
    groups_members.member_id: {Individual: 1907258}
    nsg_meetings.group_id: {NSG: 199999}
  randomized_validation:
    method: random_file_offset_source_sample_and_exact_target_lookup
    sample_size_per_source_table: 1000
    seed: 20261127
    full_source_coverage: false
    results:
      collaterals.owner_id: {sampled: 1000, nulls: 0, nonmatching: 0}
      groups_members.group_id: {sampled: 1000, nulls: 0, nonmatching: 0}
      groups_members.member_id: {sampled: 1000, nulls: 0, nonmatching: 0}
      nsg_meetings.group_id: {sampled: 1000, nulls: 0, nonmatching: 0}
  full_validation:
    status: performed
    coverage: full
    snapshot_id: ba058d581b04d1d75f63ac0a4705d98ea0d8ea54dcf577ee90b58222d082dddc
    report: ../manifest/azraq-relationships-validation.json
    initial_status: not_performed
    initial_reason: Random source samples did not establish complete null or orphan coverage.

validation_policy:
  inferred_relationships_are_constraints: false
  validated_relationships_require:
    - referenced_key_is_unique
    - null_count_is_reported
    - orphan_count_is_zero
    - subtype_mismatch_count_is_zero_when_filtered
    - relationship_semantics_are_reviewed
  recommended_status_values: [inferred, needs_review, validated, rejected]
  recommended_confidence_bands:
    high: ">= 0.90"
    medium: "0.60-0.89"
    low: "< 0.60"
