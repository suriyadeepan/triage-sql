# Relationship metadata for the azraq dataset.
#
# These are relationship metadata, NOT database-enforced constraints.
# Confidence records the strength of the available profiling and semantic evidence.

metadata_version: 2
dataset: azraq
source_schema: azraq-schema.sql
source_observations: azraq.md
inference:
  method:
    - column_name_semantics
    - referenced_table_and_key_name_match
    - sample_value_observations
  sample_scope: first_10_rows_per_table
  limitation: >
    The source schema declares no primary keys or foreign keys. Confidence
    scores are evidence summaries, not statistical probabilities. The initial
    four-client evidence includes randomized samples and manual full-file subtype
    counts; current full referential results are in full_validation and its report.

